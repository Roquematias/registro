<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <header>
        <h1>Registro de Usuario</h1>
        <p>Completá los siguientes datos para crear tu cuenta.</p>
    </header>

    <main>
        <form action="#" method="POST">
            
            <div>
                <label for="nombre">Nombre completo:</label><br>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    placeholder="Ej: Juan Pérez" 
                    required 
                    tabindex="1"
                >
            </div>
            <br>

            <div>
                <label for="correo">Correo electrónico:</label><br>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo" 
                    placeholder="Ej: correo@ejemplo.com" 
                    required 
                    tabindex="2"
                >
            </div>
            <br>

            <div>
                <label for="contrasena">Contraseña:</label><br>
                <input 
                    type="password" 
                    id="contrasena" 
                    name="contrasena" 
                    placeholder="Mínimo 8 caracteres" 
                    minlength="8"
                    required 
                    tabindex="3"
                >
            </div>
            <br>

            <fieldset>
                <legend>Género:</legend>
                
                <input type="radio" id="masculino" name="genero" value="masculino" required tabindex="4">
                <label for="masculino">Masculino</label><br>

                <input type="radio" id="femenino" name="genero" value="femenino" tabindex="5">
                <label for="femenino">Femenino</label><br>

                <input type="radio" id="otro" name="genero" value="otro" tabindex="6">
                <label for="otro">Otro</label>
            </fieldset>
            <br>

            <fieldset>
                <legend>Intereses:</legend>

                <input type="checkbox" id="programacion" name="intereses" value="programacion" checked tabindex="7">
                <label for="programacion">Programación y Tecnología</label><br>

                <input type="checkbox" id="videojuegos" name="intereses" value="videojuegos" tabindex="8">
                <label for="videojuegos">Videojuegos</label><br>

                <input type="checkbox" id="musica" name="intereses" value="musica" tabindex="9">
                <label for="musica">Música</label><br>

                <input type="checkbox" id="deporte" name="intereses" value="deporte" tabindex="10">
                <label for="deporte">Deporte</label>
            </fieldset>
            <br>

            <div>
                <label for="comentarios">Comentarios adicionales:</label><br>
                <textarea 
                    id="comentarios" 
                    name="comentarios" 
                    rows="4" 
                    cols="40" 
                    placeholder="Escribe aquí alguna observación o comentario opcional"
                    tabindex="11"
                ></textarea>
            </div>
            <br>

            <div>
                <label for="pais">País:</label><br>
                <select id="pais" name="pais" required tabindex="12">
                    <option value="" disabled selected>-- Seleccioná tu país --</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="uruguay">Uruguay</option>
                </select>
            </div>
            <br>

            <div>
                <button type="submit" tabindex="13">Registrarse</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Tecnicatura Universitaria en Programación</p>
    </footer>

</body>
</html>
